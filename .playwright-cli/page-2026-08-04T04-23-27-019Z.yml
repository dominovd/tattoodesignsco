      - heading "How the collections are organised" [level=2] [ref=e285]
      - paragraph [ref=e286]: Each collection combines choices people make together, such as audience, placement, subject and style. The label under every image states the body area, approximate size, treatment and colour. Use those details to compare references that could realistically support the same composition.
      - paragraph [ref=e287]: Save images for specific reasons instead of collecting near-duplicates. A useful shortlist might include one reference for overall flow, one for line weight and one for the amount of detail. The copied description turns those choices into a starting brief for an original drawing.
