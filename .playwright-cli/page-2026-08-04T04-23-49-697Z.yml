    - generic [ref=e85]:
      - heading "Compare sizes at a normal viewing distance" [level=2] [ref=e86]
      - paragraph [ref=e87]: A phone screen enlarges a small tattoo and hides the relationship between the design and the body. Measure or print a rectangle at 3, 5 and 10 cm, place it on the intended area and step back. Check the result with the arm or torso relaxed rather than turned toward a mirror.
      - paragraph [ref=e88]: The same dimensions feel different on a wrist, forearm and upper arm. Available width matters as much as height. A narrow vertical design may fit at 10 cm on the forearm, while a round subject needs more width to keep the same detail.
      - heading "Reduce detail before reducing the outline" [level=2] [ref=e89]
      - paragraph [ref=e90]: When a reference is too complex for the chosen size, identify the outer shape and the one feature that makes the subject recognisable. Remove secondary texture before shrinking everything. Bring the measurement and the simplified reference to the artist, who can set the final stencil for your anatomy.
      - paragraph [ref=e91]: Keep the original measurement in the brief, but expect the stencil to move slightly after it is placed on the body. A small adjustment can align the composition with the arm or avoid a crease without changing the overall scale you selected.
